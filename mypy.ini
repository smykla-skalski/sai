[mypy]
python_version = 3.11
warn_unused_configs = True
show_error_codes = True
pretty = True
namespace_packages = True
exclude = ^tmp/

# These packages ship no py.typed marker. Analyze their source instead of
# reporting every import from them as untyped.
[mypy-skills_ref.*]
follow_untyped_imports = True

[mypy-onepassword.*]
follow_untyped_imports = True
