interface:
  display_name: "Ship Issue"
  short_description: "Ship a GitHub issue through merge"
  default_prompt: "Use $ship-issue on this GitHub issue: implement it, pass $adversarial-review and $adversarial-test, open a PR, wait for green CI and a Copilot review, fix feedback, merge, and close the issue."
policy:
  allow_implicit_invocation: false
