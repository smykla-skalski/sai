#:schema https://smyklot.com/schema/repository-panel-v1.json

[panel]
version = 1
scope = 'repository'

[panel.sync.files]
document = '''
{
  "merges": [
    {
      "path": "CONTRIBUTING.md",
      "strategy": "markdown",
      "sections": [
        {
          "action": "after",
          "heading": "### Prerequisites",
          "content": "### SAI Monorepo Structure\n\nFor the SAI project specifically:\n\n- Every plugin uses the portable layout below, one directory per plugin in `plugins/{plugin-name}/`\n- Test individual plugins: `claude --plugin-dir plugins/{plugin-name}/`\n- Plugin-specific changes modify files in the plugin's own directory\n- Monorepo-wide changes modify root files (README.md, CLAUDE.md, etc.)\n- Plugin versions are bumped by a pre-commit hook. Enable it once per clone with `git config core.hooksPath .githooks`\n- On each commit the hook bumps the patch version of every plugin with staged changes in `plugins/{plugin-name}/`, keeps all manifests of one plugin on the same version, and stages them. README-only changes skip the bump\n- For a minor or major bump, set the version yourself in the same commit; the hook leaves it alone\n- Stage with `git add` and run `git commit` without paths; `git commit <paths>` is rejected when a bump is needed\n- Hook tests: `python3 -m unittest discover -s tests`\n\n#### Portable plugin layout\n\nOne directory serves Claude Code, Codex, Copilot CLI and opencode. Copy `plugins/humanize/` (skill without scripts) or `plugins/kup/` (skill with scripts):\n\n```text\nplugins/{name}/\n├── plugin.json                 # Agent Plugins manifest: $schema (omit if agents/ exists), extensions.\"com.openai\".interface (Codex UI)\n├── .claude-plugin/plugin.json  # Claude Code and Copilot CLI manifest: same name, version, description\n├── README.md\n└── skills/{skill}/\n    ├── SKILL.md                # name = directory name, description up to 1024 chars\n    ├── agents/openai.yaml      # optional Codex skill UI metadata\n    ├── references/\n    └── scripts/                # called by paths relative to the skill directory\n```\n\n- Plugins that ship Claude persona agents in `agents/` omit `$schema` from the root `plugin.json`: with it, Copilot CLI stops registering `agents/`. Keep each agent body identical to a copy in `skills/{skill}/references/` for agents without named subagents (see `plugins/adversarial-review/`)\n- List the plugin in both marketplaces, each pointing at `./plugins/{name}`: `.claude-plugin/marketplace.json` (`source`) and `.agents/plugins/marketplace.json` (`source.path`). Do not add `.codex-plugin/`; Codex reads the root `plugin.json`\n- SKILL.md frontmatter uses the [Agent Skills](https://agentskills.io/specification) fields (`name`, `description`, `license`, `compatibility`, `metadata`, space-separated `allowed-tools`). Claude-only keys (`argument-hint`, `user-invocable`, `disable-model-invocation`, `context`, `agent`, `model`, `hooks`) stay at the top level because Claude Code reads them nowhere else, and other agents ignore them. `agentskills validate` rejects them, so validate with `scripts/validate_skills.py`, which drops only those keys before applying the skills-ref checks\n- Every Claude-only feature the workflow uses (`$ARGUMENTS`, `${CLAUDE_SKILL_DIR}`, AskUserQuestion, subagents, `context: fork`) needs a fallback written in SKILL.md, like the \"Agent compatibility\" table in `plugins/humanize/skills/humanize/SKILL.md`\n- Migrating a plugin: `git mv` `claude/{name}/.claude-plugin/`, `skills/` and `README.md` into `plugins/{name}/`, add the root `plugin.json` with the Claude version, fold any Codex-only guidance from `codex/{name}/SKILL.md` into SKILL.md, move `codex/{name}/agents/openai.yaml` to `skills/{skill}/agents/`, delete `codex/{name}/` and `plugins/{name}/.codex-plugin/`, then fix every link to the old paths (`grep -rn \"claude/{name}\\|codex/{name}\"`). The hook bumps past the old Claude and Codex versions\n- Validate: `claude plugin validate .` and `claude plugin validate plugins/{name}`; `scripts/validate_skills.py` (or `scripts/validate_skills.py plugins/{name}/skills/{skill}`); install from the local marketplace with throwaway `CLAUDE_CONFIG_DIR`, `CODEX_HOME` and `COPILOT_HOME` directories (`codex debug prompt-input` shows whether Codex loaded the skill)\n\n#### Evaluating a skill\n\nA skill change ships with evals in `plugins/{name}/evals/`. `plugins/humanize/evals/` is the reference suite.\n\n- Cases: one directory per case with `prompt.md`, `case.yaml`, `graders/*.md`, and `files/` with a scaffold script, in the format `claude plugin eval` reads. Run `claude plugin eval plugins/{name} --scaffold --allow-tools Edit Write --judge-model opus`; the default Haiku judge misreads correct replies, and Sonnet flips its verdict on near-identical replies. Add `--json out.json --keep-temp` to keep the runs for a review. To compare with the previous version, run the same suite on a `git archive` snapshot of the base commit\n- Codex: `scripts/eval_codex.py plugins/{name} --codex /path/to/codex --out codex.json` runs the same cases on Codex with the plugin in an isolated Codex home, and maps the graders onto Codex's event stream. The codex binary must honor `CODEX_HOME`; a wrapper script that resets it installs the plugin into your real home\n- Review: `scripts/eval_review.py plugins/{name} final=out.json baseline=out.json@without codex=codex.json` has Jev (`~typesafe/jev-latest` on OpenRouter) judge every run against `evals/review.json`, in place of a human read-through. Each criterion is asked at least three ways, one of them inverted, and the summary shows how often Jev agrees with the graders. Code computes what Jev reads past: `check_quotes` finds report quotes that are not in the original, and `check_lossless` gives the word counts, the numbers, code spans, URLs and issue references the result dropped, and a word budget: a case's `reference` (a minimal rewrite that keeps everything) plus 20%, or its `max_words`. Judge Claude models through Claude Code (`--judge-model`), not OpenRouter; `eval_review.py` refuses them. It needs `OPENROUTER_API_KEY`; a full review costs under a cent\n- Triggering: `scripts/eval_triggers.py plugins/{name}` (add `--agent codex` for Codex) runs every query in `evals/triggers.json` and checks that the skill loads only when it should. Score a new description with `--description \"...\"` before you commit it. skill-creator's description loop cannot measure plugin skills, because it tests a command stand-in and stops at the first tool call\n- The scripts print NDJSON and exit 1 when a run, review or query fails. Every run is a paid model call, so CI does not run them; `tests/test_eval_tools.py` covers their offline logic and every plugin's `triggers.json` and `review.json`"
        }
      ]
    }
  ]
}
'''
