[lint]
select = ["ALL"]
ignore = [
    "D203",  # incompatible with D211 (no-blank-line-before-class)
    "D213",  # incompatible with D212 (multi-line-summary-first-line)
    "T201",  # print is the correct output mechanism for this CLI tool
    "INP001",  # standalone scripts, not a package
]

[lint.per-file-ignores]
"claude/service-mesh-debug/skills/service-mesh-debug/scripts/**" = [
    "S603", # subprocess is intentional: wraps kubectl with validated k8s resource names
    "S607", # partial path resolved via shutil.which; fallback retained for portability
]
"claude/refactor-council/skills/refactor-council/scripts/**" = [
    "S603", # subprocess is intentional: wraps git with a fixed arg list, no shell, no untrusted input
]
"plugins/refactor-council/copilot-skills/refactor-council/scripts/**" = [
    "S603", # bundled copy of the refactor-council git scanner; subprocess wraps git with a fixed arg list
]
"tests/**" = [
    "D1",     # docstrings not required in test files
    "E501",   # test strings are naturally long; wrapping hurts readability
    "COM812", # trailing comma style not enforced in tests
    "PLR0913",# test helpers legitimately need many parameters
    "PT009",  # unittest-style assertions are correct here (not pytest)
    "PT027",  # unittest-style assertRaises is correct here
    "S101",   # assert is valid in test assertions
    "S603",   # subprocess in test infrastructure is intentional
    "S607",   # partial executable path in test infrastructure is intentional
    "SLF001", # testing private functions is legitimate
    "FBT003", # assertIs(x, True/False) is standard unittest pattern
    "TRY003", # long AssertionError messages are fine in tests
    "EM102",  # f-string in exception is fine in test assertions
]
